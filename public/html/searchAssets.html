<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Search Assets · Fortnite Tools</title>
    <link rel="stylesheet" href="../style/common.css">
    <link rel="stylesheet" href="../style/searchAssets.css">
</head>
<body>
    <header>
        <span id="top"></span>
        <a href="#top" class="header-arrow-up" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></a>
        <div id="header-container">
            <div id="logo">
                <h1><a href="../../index.html">Fortnite Tools</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="./deviceMeshs.html">DeviceMeshs</a></li>
                    <li><a href="./searchAssets.html" aria-current="page">SearchAssets</a></li>
                    <li><a href="./aiChat.html">AIChat</a></li>
                    <li><a href="./items.html">Items</a></li>
                    <li><a href="./convert.html">Convert</a></li>
                    <li><a href="./pathModifier.html">PathModifier</a></li>
                    <li><a href="./id.html">Id</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div id="searchAssets">

            <div class="asset-switcher" role="group" data-i18n-aria="sa.assetList" aria-label="Asset list">
                <button id="all-assets-btn" class="asset-tab active" data-i18n="sa.all">All</button>
                <button id="new-assets-btn" class="asset-tab" data-i18n="sa.new">New</button>
            </div>

            <!-- Search panel -->
            <div class="search-container">
                <label for="keywords" class="sr-only">Keywords</label>
                <input type="text" id="keywords" data-i18n-placeholder="sa.keywords" placeholder="Keywords separated by spaces or commas" autocomplete="off">

                <div class="checkbox-group">
                    <input type="checkbox" id="formatted">
                    <label for="formatted" data-i18n="sa.formatted">Formatted</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="addC">
                    <label for="addC" data-i18n="sa.addC">Add _C</label>
                </div>

                <label class="sort-group" for="asset-sort">
                    <span data-i18n="sa.sort">Sort</span>
                    <select id="asset-sort">
                        <option value="added-desc" data-i18n="sa.sort.added-desc">Added order</option>
                        <option value="name-asc" data-i18n="sa.sort.name-asc">A → Z</option>
                        <option value="name-desc" data-i18n="sa.sort.name-desc">Z → A</option>
                    </select>
                </label>

                <div class="search-actions">
                    <button class="search-btn" id="search-btn" data-i18n="sa.search">Search</button>
                    <button class="btn" id="new-as-btn" data-i18n="sa.newAs" data-i18n-title="sa.newAsTip" title="Assets of cosmetics added in the last 7 days">New AS</button>
                    <label class="btn file-upload-btn" for="asset-files">
                        <span data-i18n="sa.chooseFiles">Upload file</span>
                        <input id="asset-files" type="file" multiple accept=".txt,.json,.log,.ini,.cfg,.usmap,.uasset,.uexp,.ubulk,text/*">
                    </label>
                    <button class="btn file-cancel-btn" id="clear-files-btn" data-i18n-title="sa.clearFiles" title="Clear uploaded files" aria-label="Clear uploaded files" hidden>×</button>
                    <button class="btn" id="copy-all-btn" data-i18n="sa.copyAll" hidden>Copy all results</button>
                </div>
                <div id="file-list" class="file-list" aria-live="polite"></div>
                <p id="file-status" class="file-status" aria-live="polite"></p>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <span id="loading-text" data-i18n="sa.searching">Searching...</span>
                </div>
            </div>

            <!-- Result count -->
            <div id="results-count" aria-live="polite"></div>

            <!-- Results table -->
            <div class="table-wrapper">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th data-i18n="sa.assetPath">Asset Path</th>
                        </tr>
                    </thead>
                    <tbody id="results"></tbody>
                </table>
            </div>
            <div class="more-row"><button class="btn" id="show-more" hidden>Show more</button><button class="btn" id="show-all" hidden data-i18n="sa.showAll">Show all</button></div>

        </div>
    </main>
    <footer>
        <p data-i18n-html="footer.help">If you have any problems, my Discord server is: <a href="производство">awa Community</a>.</p>
    </footer>
    <script src="https://kit.fontawesome.com/1d1c3ac163.js" crossorigin="anonymous"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/assetLib.js"></script>
    <script src="../js/cosmeticsApi.js"></script>
    <script src="../js/searchAssets.js"></script>
</body>
</html>
